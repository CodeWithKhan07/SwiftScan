name: fatoralens
description: "FatoraLens - bilingual Saudi invoice and document scanner."
publish_to: "none"
version: 2.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Application/state/navigation and dependency injection.
  get: ^4.6.6
  get_it: ^9.2.1

  # Local-first persistence. Isar Community replaces Hive/GetStorage.
  isar_community: 3.3.2
  isar_community_flutter_libs: 3.3.2

  # Shared utilities.
  uuid: ^4.5.1
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.5
  share_plus: ^12.0.1

  # Capture, scan, crop, QR and local OCR/image processing.
  camerawesome: ^2.5.0
  image_picker: ^1.2.3
  file_picker: ^11.0.2
  mobile_scanner: ^7.4.0
  crop_your_image: ^2.0.0
  image: 4.5.1
  google_mlkit_text_recognition: ^0.15.1
  google_mlkit_document_scanner: ^0.5.0
  local_auth: ^3.0.1

  # PDF creation/manipulation/conversion.
  # excel/archive/xml are intentionally NOT direct dependencies.
  # image 4.5.1 intentionally stays on Archive 3.x compatibility.
  # pdf_manipulator is the single implementation for PDF <-> XLSX/DOCX/PPTX conversion.
  pdf: 3.12.0
  pdf_manipulator: 4.1.0

  # Firebase: Android initializes from google-services.json; no firebase_options.dart.
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  firebase_storage: ^13.4.5
  firebase_remote_config: ^6.5.5
  firebase_app_check: ^0.4.5+2
  firebase_analytics: ^12.4.5
  firebase_crashlytics: ^5.2.6
  firebase_ai: ^3.14.1

  # Monetization.
  google_mobile_ads: ^9.0.0
  in_app_purchase: ^3.3.0
  flutter_spinkit: ^5.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  isar_community_generator: 3.3.2
  # 2.10.5 stays on analyzer 8-10, matching Isar Community 3.3.2.
  build_runner: 2.10.5
  # Generates every Android launcher-icon density from the production logo.
  flutter_launcher_icons: ^0.14.4

# Keep legacy, round, adaptive, and Android 12 splash icons synchronized.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_logo.png"
  min_sdk_android: 23
  adaptive_icon_background: "#118CE9"
  adaptive_icon_foreground: "assets/app_logo.png"
  adaptive_icon_foreground_inset: 0

flutter:
  uses-material-design: true
  assets:
    # The same production mark is rendered by the in-app animated splash.
    - assets/app_logo.png
